name: Release

# Tag `vX.Y.Z` -> build, test, pack the tool, publish to NuGet.org, create a GitHub release.
# Uses nuget.org Trusted Publishing (OIDC, no stored API key). Needs a nuget.org policy for
# owner csa7mdm / repo DotNetDevMCP / workflow release.yml, and repo secret NUGET_USER (nuget.org profile name).

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write
  id-token: write  # OIDC token for NuGet/login

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build DotNetDevMCP.sln --configuration Release -p:Version=${{ steps.v.outputs.version }}

      - name: Test
        run: dotnet test DotNetDevMCP.sln --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/DotNetDevMCP.Server/DotNetDevMCP.Server.csproj --configuration Release --no-build --output artifacts -p:Version=${{ steps.v.outputs.version }}

      # nuget.org only detects the MCP server config at exactly this entry name.
      - name: Check server.json is packed
        run: |
          unzip -Z1 artifacts/DotNetDevMCP.${{ steps.v.outputs.version }}.nupkg | grep -qx '.mcp/server.json'
          # MCP Registry ownership check reads this from the packed README.
          unzip -p artifacts/DotNetDevMCP.${{ steps.v.outputs.version }}.nupkg README.md | grep -q 'mcp-name: io.github.csa7mdm/dotnetdevmcp'

      # Right before push: the temporary key lives 1 hour.
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: artifacts/*.nupkg
          generate_release_notes: true
