name: Release

# Tag `vX.Y.Z` -> build, test, pack the tool, publish to NuGet.org, create a GitHub release.
# Requires repository secret NUGET_API_KEY (nuget.org API key scoped to push DotNetDevMCP).

on:
  push:
    tags: [ 'v*.*.*' ]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Version from tag
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build
        run: dotnet build DotNetDevMCP.sln --configuration Release -p:Version=${{ steps.v.outputs.version }}

      - name: Test
        run: dotnet test DotNetDevMCP.sln --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/DotNetDevMCP.Server/DotNetDevMCP.Server.csproj --configuration Release --no-build --output artifacts -p:Version=${{ steps.v.outputs.version }}

      - name: Push to NuGet.org
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "${{ secrets.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.nupkg
          generate_release_notes: true
