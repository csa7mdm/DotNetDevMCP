name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DotNetDevMCP.sln

      - name: Build
        run: dotnet build DotNetDevMCP.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DotNetDevMCP.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Smoke test (stdio handshake + tools/list)
        shell: bash
        run: |
          exe=$(find src/DotNetDevMCP.Server/bin/Release/net10.0 -maxdepth 1 -name 'dotnetdevmcp' -o -maxdepth 1 -name 'dotnetdevmcp.exe' | head -1)

          # Counts "name":" only in the tools/list response line (id 2), not the initialize
          # response's serverInfo.name, so the count is exactly the number of tools.
          count_tools() {
            grep '"id":2' "$1" | grep -o '"name":"' | wc -l
          }

          { printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'; sleep 5; } \
            | "$exe" --log-level Warning 2>/dev/null > smoke-default.out || true
          count=$(count_tools smoke-default.out)
          echo "tools listed (default): $count"
          test "$count" -eq 37

          { printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'; sleep 5; } \
            | "$exe" --log-level Warning --enable git,monitoring 2>/dev/null > smoke-enabled.out || true
          count=$(count_tools smoke-enabled.out)
          echo "tools listed (--enable git,monitoring): $count"
          test "$count" -eq 53

      - name: Pack tool
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack src/DotNetDevMCP.Server/DotNetDevMCP.Server.csproj --configuration Release --no-build --output artifacts

      - name: Check server.json is packed
        if: matrix.os == 'ubuntu-latest'
        run: |
          unzip -Z1 artifacts/DotNetDevMCP.*.nupkg | grep -qx '.mcp/server.json'
          # MCP Registry ownership check reads this from the packed README.
          unzip -p artifacts/DotNetDevMCP.*.nupkg README.md | grep -q 'mcp-name: io.github.csa7mdm/dotnetdevmcp'

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: nupkg
          path: artifacts/*.nupkg
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**/*.trx
          retention-days: 7

  sandbox:
    name: container sandbox containment
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Build image
        run: docker build -t dotnetdevmcp:ci .

      - name: Smoke test (container --help)
        run: docker run --rm dotnetdevmcp:ci --help

      - name: Fix fixtures ownership for the container's uid 10001 user
        run: chmod -R a+rwX tests/Sandbox.Fixtures

      - name: Restore Sandbox.Fixtures (network needed)
        run: |
          docker run --rm \
            -v "$PWD/tests/Sandbox.Fixtures:/src" \
            -v nuget:/home/mcp/.nuget/packages \
            --entrypoint dotnet \
            dotnetdevmcp:ci restore /src

      - name: Run sandbox containment tests
        run: |
          docker run --rm \
            --network none \
            --memory 8g \
            --pids-limit 512 \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            -v "$PWD/tests/Sandbox.Fixtures:/src" \
            -v nuget:/home/mcp/.nuget/packages \
            --entrypoint dotnet \
            dotnetdevmcp:ci test /src --no-restore
