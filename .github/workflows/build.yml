name: Build and Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore DotNetDevMCP.sln

      - name: Build
        run: dotnet build DotNetDevMCP.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test DotNetDevMCP.sln --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Smoke test (stdio handshake + tools/list)
        shell: bash
        run: |
          exe=$(find src/DotNetDevMCP.Server/bin/Release/net10.0 -maxdepth 1 -name 'dotnetdevmcp' -o -maxdepth 1 -name 'dotnetdevmcp.exe' | head -1)
          { printf '%s\n' \
              '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
              '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
              '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}'; sleep 5; } \
            | "$exe" --log-level Warning 2>/dev/null > smoke.out || true
          count=$(grep -o '"name":"' smoke.out | wc -l)
          echo "tools listed: $count"
          test "$count" -ge 50

      - name: Pack tool
        if: matrix.os == 'ubuntu-latest'
        run: dotnet pack src/DotNetDevMCP.Server/DotNetDevMCP.Server.csproj --configuration Release --no-build --output artifacts

      - name: Check server.json is packed
        if: matrix.os == 'ubuntu-latest'
        run: unzip -Z1 artifacts/DotNetDevMCP.*.nupkg | grep -qx '.mcp/server.json'

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: nupkg
          path: artifacts/*.nupkg
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/**/*.trx
          retention-days: 7
