<svg xmlns="http://www.w3.org/2000/svg" width="880" height="300" viewBox="0 0 880 300" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <title>Benchmark on Polly</title>
  <rect x="0.5" y="0.5" width="879" height="299" rx="14" fill="#ffffff" stroke="#d0d7de"/>
  <text x="30" y="40" font-size="17" font-weight="700" fill="#1f2328">Measured on Polly (801 C# files, 3,065 tests on net10.0)</text>

  <!-- Panel 1: test time -->
  <text x="30" y="80" font-size="14" font-weight="600" fill="#1f2328">Test run after a one-file change</text>
  <text x="30" y="118" font-size="13" fill="#57606a">Full test suite</text>
  <rect x="190" y="102" width="230" height="24" rx="4" fill="#8c959f"/>
  <text x="428" y="119" font-size="13" font-weight="600" fill="#1f2328">48.1 s</text>
  <text x="30" y="156" font-size="13" fill="#57606a">Affected tests only</text>
  <rect x="190" y="140" width="24.4" height="24" rx="4" fill="#512bd4"/>
  <text x="222" y="157" font-size="13" font-weight="600" fill="#512bd4">5.1 s  (5 tests)</text>

  <!-- Panel 2: context size -->
  <text x="490" y="80" font-size="14" font-weight="600" fill="#1f2328">"Where is CancellationToken used?"</text>
  <text x="490" y="118" font-size="13" fill="#57606a">grep -w</text>
  <rect x="600" y="102" width="200" height="24" rx="4" fill="#8c959f"/>
  <text x="808" y="119" font-size="13" font-weight="600" fill="#1f2328">202 KB</text>
  <text x="490" y="156" font-size="13" fill="#57606a">FindReferences</text>
  <rect x="600" y="140" width="6.4" height="24" rx="3" fill="#512bd4"/>
  <text x="614" y="157" font-size="13" font-weight="600" fill="#512bd4">6.5 KB  (137 real references)</text>

  <line x1="30" y1="196" x2="850" y2="196" stroke="#d0d7de"/>
  <g font-size="13" fill="#1f2328">
    <text x="30" y="226"><tspan font-weight="600">Safe:</tspan> selections included 111 of the 112 tests that injected faults broke.</text>
    <text x="30" y="250"><tspan font-weight="600">Honest:</tspan> changes that reach many tests gain nothing; they run the full suite on purpose.</text>
  </g>
  <text x="30" y="280" font-size="11" fill="#57606a">i7-10750H, Windows 11, .NET 10 SDK. Method, scripts and raw data: benchmarks/polly in the repository.</text>
</svg>
